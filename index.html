
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#123d36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>دليل أسعار المحل</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Tahoma,sans-serif;
 background:#f3f6f5;
 color:#172b27;
}
header{
 background:#123d36;
 color:white;
 padding:20px 15px;
 text-align:center;
}
header h1{margin:0 0 8px;font-size:24px}
header p{margin:0;font-size:14px}
.container{max-width:850px;margin:auto;padding:14px}
.card{
 background:white;
 padding:15px;
 margin-bottom:14px;
 border-radius:14px;
 box-shadow:0 2px 8px #0000000b;
}
h2{font-size:18px;margin:0 0 12px}
input,select,textarea,button{
 width:100%;
 padding:12px;
 margin:5px 0;
 border:1px solid #d5dfdc;
 border-radius:9px;
 font-size:15px;
 font-family:inherit;
}
button{
 background:#176b59;
 color:white;
 border:none;
 font-weight:bold;
 cursor:pointer;
}
button.secondary{background:#e7efec;color:#123d36}
button.danger{background:#b52c35;color:white}
button.small{padding:8px;font-size:13px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.categories{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-bottom:10px;
}
.category{
 width:auto;
 padding:9px 13px;
 background:#e4ece9;
 color:#123d36;
 border-radius:20px;
}
.category.active{background:#123d36;color:white}
.products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}
.product{
 border:1px solid #e1e9e6;
 border-radius:12px;
 overflow:hidden;
 background:white;
 min-width:0;
}
.product img{
 width:100%;
 height:155px;
 object-fit:cover;
 background:#eef2f0;
 display:block;
}
.product-content{padding:10px}
.product h3{font-size:15px;margin:0 0 7px;overflow-wrap:anywhere}
.price{color:#137657;font-size:18px;font-weight:bold;margin:8px 0}
.details{font-size:13px;line-height:1.8;color:#53645f;overflow-wrap:anywhere}
.actions{display:flex;gap:5px;margin-top:8px}
.actions button{padding:8px 3px;font-size:12px}
.empty{text-align:center;color:#7b8985;padding:20px}
.hint{font-size:12px;color:#667873;line-height:1.7}
label{display:block;margin-top:8px;font-size:14px;font-weight:bold}
#photoPreview{
 max-width:150px;
 max-height:150px;
 display:none;
 margin:8px auto;
 border-radius:10px;
 object-fit:cover;
}
@media(min-width:600px){
 .products{grid-template-columns:repeat(3,minmax(0,1fr))}
 .product img{height:180px}
}
</style>
</head>

<body>
<header>
 <h1>دليل أسعار المحل</h1>
 <p>كتالوج منتجاتك وأسعارك في مكان واحد</p>
</header>

<main class="container">

 <section class="card">
  <h2>🔎 البحث عن منتج</h2>
  <input id="search" type="search" placeholder="اكتب اسم المنتج أو اللون أو المقاس...">
 </section>

 <section class="card">
  <h2>📂 الأقسام</h2>
  <div id="categories" class="categories"></div>
  <div class="row">
   <input id="newCategory" placeholder="اسم القسم الجديد">
   <button id="addCategory" type="button">إضافة قسم</button>
  </div>
 </section>

 <section class="card">
  <h2 id="formTitle">➕ إضافة منتج جديد</h2>

  <form id="productForm">
   <input id="productId" type="hidden">

   <label for="name">اسم المنتج *</label>
   <input id="name" required placeholder="مثال: تيشيرت رجالي">

   <label for="price">السعر بالجنيه *</label>
   <input id="price" type="number" min="0" step="0.01" required placeholder="مثال: 250">

   <label for="category">القسم *</label>
   <select id="category" required></select>

   <label for="colors">الألوان المتاحة</label>
   <input id="colors" placeholder="مثال: أسود، أبيض، أزرق">

   <label for="sizes">المقاسات المتاحة</label>
   <input id="sizes" placeholder="مثال: M، L، XL، XXL">

   <label for="notes">ملاحظات</label>
   <textarea id="notes" rows="2" placeholder="تفاصيل إضافية عن المنتج"></textarea>

   <label for="photo">صورة المنتج من المعرض 📷</label>
   <input id="photo" type="file" accept="image/*">
   <p class="hint">اختار صورة جاهزة من معرض الموبايل أو من الملفات. مش مطلوب تصوير صورة جديدة.</p>
   <img id="photoPreview" alt="معاينة صورة المنتج">

   <button type="submit" id="saveButton">حفظ المنتج</button>
   <button type="button" class="secondary" id="cancelEdit" hidden>إلغاء التعديل</button>
  </form>
 </section>

 <section class="card">
  <div class="row">
   <h2 style="flex:2">🛍️ المنتجات</h2>
   <button id="exportButton" class="secondary small">نسخة احتياطية</button>
  </div>

  <label for="importFile">استعادة نسخة احتياطية</label>
  <input id="importFile" type="file" accept=".json,application/json">
  <p class="hint">احتفظ بنسخة احتياطية من بياناتك وصور المنتجات بانتظام.</p>
  <div id="products" class="products"></div>
 </section>

</main>

<script>
(function(){
"use strict";

const STORAGE_KEY = "daleel_asaar_v1";

const DEFAULT_CATEGORIES = [
 "ملابس أطفال",
 "أحذية",
 "ملابس حريمي",
 "ملابس رجالي",
 "أقسام أخرى"
];

let data = {categories:DEFAULT_CATEGORIES.slice(),products:[]};
let selectedCategory = "الكل";
let currentPhoto = "";

const $ = id => document.getElementById(id);

function loadData(){
 try{
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
   const parsed = JSON.parse(saved);
   if(parsed && Array.isArray(parsed.categories) &&
      Array.isArray(parsed.products)){
    data = parsed;
   }
  }
 }catch(e){
  alert("تعذر قراءة البيانات المحفوظة.");
 }
 if(!data.categories.length) data.categories = DEFAULT_CATEGORIES.slice();
}

function saveData(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  return true;
 }catch(e){
  alert("مساحة التخزين ممتلئة. قلل حجم الصور أو احذف بعض الصور ثم حاول مرة أخرى.");
  return false;
 }
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function renderCategories(){
 const all = ["الكل",...data.categories];
 $("categories").innerHTML = all.map(cat =>
  `<button type="button" class="category ${cat===selectedCategory?"active":""}"
   data-category="${escapeHTML(cat)}">${escapeHTML(cat)}</button>`
 ).join("");

 $("category").innerHTML = data.categories.map(cat =>
  `<option value="${escapeHTML(cat)}">${escapeHTML(cat)}</option>`
 ).join("");

 $("categories").querySelectorAll("[data-category]").forEach(button=>{
  button.addEventListener("click",()=>{
   selectedCategory = button.dataset.category;
   renderCategories();
   renderProducts();
  });
 });
}

function renderProducts(){
 const term = $("search").value.trim().toLowerCase();

 const list = data.products.filter(p=>{
  const matchesCategory = selectedCategory==="الكل" || p.category===selectedCategory;
  const searchable = [p.name,p.category,p.colors,p.sizes,p.notes].join(" ").toLowerCase();
  return matchesCategory && searchable.includes(term);
 });

 if(!list.length){
  $("products").innerHTML='<div class="empty">لا توجد منتجات لعرضها.</div>';
  return;
 }

 $("products").innerHTML = list.map(p=>`
  <article class="product">
   ${p.photo
    ? `<img src="${p.photo}" alt="${escapeHTML(p.name)}" loading="lazy">`
    : `<div class="empty">لا توجد صورة</div>`}
   <div class="product-content">
    <h3>${escapeHTML(p.name)}</h3>
    <div class="price">${Number(p.price).toLocaleString("ar-EG")} ج.م</div>
    <div class="details">
     القسم: ${escapeHTML(p.category)}<br>
     ${p.colors ? "الألوان: "+escapeHTML(p.colors)+"<br>":""}
     ${p.sizes ? "المقاسات: "+escapeHTML(p.sizes)+"<br>":""}
     ${p.notes ? "ملاحظات: "+escapeHTML(p.notes):""}
    </div>
    <div class="actions">
     <button type="button" data-edit="${escapeHTML(p.id)}">تعديل</button>
     <button type="button" class="danger" data-delete="${escapeHTML(p.id)}">حذف</button>
    </div>
   </div>
  </article>
 `).join("");

 $("products").querySelectorAll("[data-edit]").forEach(btn=>{
  btn.addEventListener("click",()=>editProduct(btn.dataset.edit));
 });
 $("products").querySelectorAll("[data-delete]").forEach(btn=>{
  btn.addEventListener("click",()=>deleteProduct(btn.dataset.delete));
 });
}

function resetForm(){
 $("productForm").reset();
 $("productId").value = "";
 currentPhoto = "";
 $("photoPreview").src = "";
 $("photoPreview").style.display = "none";
 $("formTitle").textContent = "➕ إضافة منتج جديد";
 $("saveButton").textContent = "حفظ المنتج";
 $("cancelEdit").hidden = true;
}

function editProduct(id){
 const p = data.products.find(item=>item.id===id);
 if(!p) return;

 $("productId").value = p.id;
 $("name").value = p.name;
 $("price").value = p.price;
 $("category").value = p.category;
 $("colors").value = p.colors || "";
 $("sizes").value = p.sizes || "";
 $("notes").value = p.notes || "";
 currentPhoto = p.photo || "";

 if(currentPhoto){
  $("photoPreview").src = currentPhoto;
  $("photoPreview").style.display = "block";
 }else{
  $("photoPreview").style.display = "none";
 }

 $("formTitle").textContent = "✏️ تعديل المنتج";
 $("saveButton").textContent = "حفظ التعديلات";
 $("cancelEdit").hidden = false;
 window.scrollTo({top:0,behavior:"smooth"});
}

function deleteProduct(id){
 const p = data.products.find(item=>item.id===id);
 if(!p || !confirm("هل تريد حذف المنتج: "+p.name+"؟")) return;

 data.products = data.products.filter(item=>item.id!==id);
 if(saveData()) renderProducts();
}

function compressImage(file){
 return new Promise((resolve,reject)=>{
  if(!file.type.startsWith("image/")){
   reject(new Error("اختار ملف صورة صالح."));
   return;
  }

  const reader = new FileReader();
  reader.onerror = ()=>reject(new Error("تعذر قراءة الصورة."));
  reader.onload = ()=>{
   const img = new Image();
   img.onerror = ()=>reject(new Error("تعذر فتح الصورة."));
   img.onload = ()=>{
    const maxSize = 900;
    let width = img.width;
    let height = img.height;
    const scale = Math.min(1,maxSize/Math.max(width,height));
    width = Math.round(width*scale);
    height = Math.round(height*scale);

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img,0,0,width,height);

    resolve(canvas.toDataURL("image/jpeg",0.78));
   };
   img.src = reader.result;
  };
  reader.readAsDataURL(file);
 });
}

$("photo").addEventListener("change",async function(){
 const file = this.files && this.files[0];
 if(!file) return;

 try{
  currentPhoto = await compressImage(file);
  $("photoPreview").src = currentPhoto;
  $("photoPreview").style.display = "block";
 }catch(error){
  alert(error.message || "تعذر تحميل الصورة.");
  this.value = "";
 }
});

$("productForm").addEventListener("submit",function(event){
 event.preventDefault();

 const id = $("productId").value || String(Date.now());
 const old = data.products.find(p=>p.id===id);

 const product = {
  id,
  name:$("name").value.trim(),
  price:Number($("price").value),
  category:$("category").value,
  colors:$("colors").value.trim(),
  sizes:$("sizes").value.trim(),
  notes:$("notes").value.trim(),
  photo:currentPhoto || (old ? old.photo : "")
 };

 if(!product.name || !Number.isFinite(product.price) || product.price<0){
  alert("تأكد من كتابة اسم المنتج والسعر بشكل صحيح.");
  return;
 }

 if(old){
  data.products = data.products.map(p=>p.id===id ? product : p);
 }else{
  data.products.unshift(product);
 }

 if(saveData()){
  resetForm();
  renderCategories();
  renderProducts();
  alert(old ? "تم تعديل المنتج." : "تم حفظ المنتج.");
 }
});

$("cancelEdit").addEventListener("click",resetForm);

$("addCategory").addEventListener("click",()=>{
 const name = $("newCategory").value.trim();
 if(!name) return alert("اكتب اسم القسم أولاً.");
 if(data.categories.includes(name)) return alert("القسم موجود بالفعل.");

 data.categories.push(name);
 selectedCategory = name;
 $("newCategory").value = "";

 if(saveData()){
  renderCategories();
  renderProducts();
 }
});

$("search").addEventListener("input",renderProducts);

$("exportButton").addEventListener("click",()=>{
 const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");
 a.href = url;
 a.download = "daleel-asaar-backup.json";
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
});

$("importFile").addEventListener("change",function(){
 const file = this.files && this.files[0];
 if(!file) return;

 const reader = new FileReader();
 reader.onload = ()=>{
  try{
   const imported = JSON.parse(reader.result);
   if(!imported || !Array.isArray(imported.categories) ||
      !Array.isArray(imported.products)){
    throw new Error();
   }

   if(!confirm("استعادة النسخة ستستبدل البيانات الحالية. هل تريد المتابعة؟")) return;

   const previous = data;
   data = imported;

   if(saveData()){
    selectedCategory = "الكل";
    renderCategories();
    renderProducts();
    resetForm();
    alert("تمت استعادة النسخة الاحتياطية.");
   }else{
    data = previous;
   }
  }catch(e){
   alert("الملف غير صالح أو ليس نسخة احتياطية من التطبيق.");
  }finally{
   $("importFile").value = "";
  }
 };
 reader.readAsText(file);
});

loadData();
renderCategories();
renderProducts();

if("serviceWorker" in navigator && location.protocol==="https:"){
 navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
})();
</script>
</body>
</html>
